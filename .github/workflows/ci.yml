name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enhetstester
        run: npm test

      - name: Installer avhengigheter
        run: npm install

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E-røyktest
        run: npm run e2e
